[platformio]
default_envs = esp32thing

[env]
build_flags =
    ; to use e.g. as part of the firmware name
    '-DPIOENV="${PIOENV}"'

    ; coding_standards
    -Wno-unused-variable
    -Wno-unused-but-set-variable
    -Wunreachable-code
    -Wno-error

    ; debug level 5=VERBOSE https://docs.platformio.org/en/latest/platforms/espressif32.html#debug-level
    ;  -DCORE_DEBUG_LEVEL=5
extra_scripts = pre:extra_script.py

lib_deps =
	knolleary/PubSubClient@^2.8
	prampec/IotWebConf@^3.2.1
	bblanchon/ArduinoJson@^6.21.3
	adafruit/DHT sensor library@^1.4.4
	claws/BH1750@^1.3.0
	adafruit/Adafruit Unified Sensor@^1.1.13

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
framework = arduino
lib_deps = ${env.lib_deps}
build_flags = ${env.build_flags}
monitor_speed = 115200
board_upload.flash_size = 8MB ; Example for 8MB flash
; change MCU frequency
board_build.f_cpu = 240000000L
; board_build.embed_files = cert_gen/x509_crt_bundle
board_build.embed_files = data/cert/x509_crt_bundle
; board_build.filesystem = littlefs

[env:esp32thing]
platform = espressif32
board = esp32thing
framework = arduino
lib_deps = ${env.lib_deps}
build_flags = ${env.build_flags}
test_framework = unity
check_tool = cppcheck, clangtidy
check_flags = cppcheck: --enable=all --inline-suppr --suppress=*:.pio/* --error-exitcode=1 --verbose
              clangtidy: --checks=-*,cert-*,clang-analyzer-*,bugprone-*,performance-*,readability-* 
                         --fix 
                         --fix-errors 
                         --system-headers
platform_packages = tool-cppcheck@1.260.0

[env:wemod-d1]
board = d1
framework = arduino
lib_deps = ${env.lib_deps}
build_flags = ${env.build_flags}
